<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>لوحة الحسابات - وهمية</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">

        <div class="card main-card">
            <h2>📋 القائمة الرئيسية</h2>
            <p><span>🆔 ايدي حسابك:</span> <strong id="userId">8505541555</strong></p>
            <p><span>💰 رصيدك:</span> <strong class="balance" id="balance">$ 4.36</strong></p>
            <p><span>💵 عملة البوت:</span> $ دولار</p>
            <div class="btn-group">
                <button class="btn" onclick="alert('قناة البوت: @FakeBotChannel')">1. قناة البوت الرسمية</button>
                <button class="btn" onclick="alert('قناة الاكتمالات: @FakeComplete')">2. قناة الاكتمالات</button>
                <button class="btn test-btn" onclick="testBot()">🧪 اختبار البوت</button>
            </div>
            <p class="time">🕒 12:19 ص</p>
        </div>

        <div class="card accounts-card">
            <h3>📱 حسابات تليجرام جاهزة</h3>
            <ul id="accountsList"></ul>
            <div class="btn-group">
                <button class="btn small" onclick="addFakeAccount()">➕ إضافة رقم وهمي</button>
                <button class="btn small danger" onclick="removeLastAccount()">✖ حذف آخر رقم</button>
            </div>
        </div>

        <div class="card services-card">
            <div class="service-grid">
                <button class="service-btn" onclick="alert('الوكلاء: قائمة وهمية')">👥 الوكالء</button>
                <button class="service-btn" onclick="alert('فريق الدعم: @FakeSupport')">🛠 فريق الدعم</button>
                <button class="service-btn" onclick="chargeBalance()">💳 شحن رصيد</button>
                <button class="service-btn" onclick="alert('الشارع الناجح: رحلة وهمية')">🏆 الشارع الناجح</button>
                <button class="service-btn" onclick="alert('الإعدادات: قيد التطوير')">⚙️ الاعدادات</button>
            </div>
        </div>

        <div class="card referral-card">
            <h3>🔗 الإحالة الخاص بك</h3>
            <p>رابط الإحالة: <code id="refLink">https://t.me/FakeBot?start=ref123456</code></p>
            <button class="btn small" onclick="copyRef()">📋 نسخ الرابط</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
